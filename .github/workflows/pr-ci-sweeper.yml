name: PR CI Sweeper

# Non-destructively revives canceled GitHub Actions checks attached to auto-merge
# PR heads. GITHUB_TOKEN close/reopen events would not trigger new CI runs, so
# that upstream-only repair lane is intentionally disabled in this fork.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended repairs without closing/reopening or rerunning workflows.
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pr-ci-sweeper
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Forks do not inherit the upstream GitHub App installation or its secrets.
      # The built-in token can revive canceled auto-merge runs; close/reopen is
      # disabled because events made with GITHUB_TOKEN do not start new CI runs.
      - name: Sweep dropped PR CI runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { pathToFileURL } = require("node:url");
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/github/pr-ci-sweeper.mjs`,
            );
            const { runPrCiSweeper } = await import(moduleUrl.href);

            await runPrCiSweeper({
              github,
              context,
              core,
              dryRun: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }},
              canRefire: false,
            });
